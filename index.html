<!-- ADMITMATE v2.1 ADD-ON: START -->
<style>
.am21-fab{
 position:fixed;right:20px;bottom:20px;z-index:1000;
 width:60px;height:60px;border-radius:50%;border:0;
 background:#4868e8;color:white;font-size:27px;
 box-shadow:0 6px 25px #263f7b55;cursor:pointer
}
.am21-chat{
 display:none;position:fixed;right:18px;bottom:90px;
 z-index:1000;width:min(380px,calc(100vw - 36px));
 height:min(540px,calc(100dvh - 115px));
 background:white;border:1px solid #dfe5f0;
 border-radius:18px;box-shadow:0 12px 40px #172b4d33;
 overflow:hidden;flex-direction:column
}
.am21-chat.open{display:flex}
.am21-chathead{
 background:#4868e8;color:white;padding:15px;
 display:flex;justify-content:space-between;align-items:center
}
.am21-chathead button{
 background:transparent;color:white;border:0;
 font-size:24px;cursor:pointer
}
.am21-messages{
 flex:1;overflow-y:auto;padding:15px;background:#f8faff
}
.am21-msg{
 max-width:90%;padding:11px 13px;margin:9px 0;
 border-radius:12px;font-size:14px;white-space:pre-wrap
}
.am21-bot{background:white;border:1px solid #e1e6f0}
.am21-user{background:#e2eaff;margin-left:auto}
.am21-chatform{
 display:flex;gap:7px;padding:11px;border-top:1px solid #e1e6f0
}
.am21-chatform input{flex:1;min-width:0}
.am21-chatform button{
 background:#4868e8;color:white;border:0;
 border-radius:9px;padding:9px 12px;cursor:pointer
}
.am21-chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px}
.am21-chips button{
 background:#eef2ff;color:#344bb2;border:1px solid #dce4ff;
 border-radius:20px;padding:6px 9px;font-size:12px;cursor:pointer
}
.am21-note{
 padding:12px;background:#fff8e9;border-left:4px solid #e5ae4b;
 border-radius:7px;font-size:13px;margin:12px 0
}
.am21-test{
 border:1px solid #e1e6f0;border-radius:12px;
 padding:15px;margin:12px 0;background:white
}
.am21-test h3{margin:0 0 6px}
.am21-test .am21-fields{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
 gap:10px
}
.am21-test label{font-size:12px}
.am21-rank{
 border:1px solid #e1e6f0;border-radius:12px;
 padding:16px;margin:12px 0
}
.am21-rank a{display:inline-block;margin:5px 12px 5px 0}
</style>

<script>
(function(){
"use strict";

const KEY="admitmate_v21_requirements";

const TESTS=[
 {id:"IELTS",name:"IELTS",kind:"English proficiency",
 info:"English-language test. Check the accepted version and score."},
 {id:"TOEFL",name:"TOEFL",kind:"English proficiency",
 info:"English-language test accepted by many institutions."},
 {id:"PTE",name:"PTE Academic",kind:"English proficiency",
 info:"Check whether your programme accepts this test."},
 {id:"Duolingo",name:"Duolingo English Test",kind:"English proficiency",
 info:"Accepted by some programmes, not universally."},
 {id:"GRE",name:"GRE",kind:"Graduate admission",
 info:"May be required or optional for certain graduate programmes."},
 {id:"GMAT",name:"GMAT",kind:"Business school admission",
 info:"May be relevant for MBA and other business programmes."},
 {id:"SAT",name:"SAT",kind:"Undergraduate admission",
 info:"Requirements vary by institution and programme."},
 {id:"ACT",name:"ACT",kind:"Undergraduate admission",
 info:"An alternative undergraduate admission test in some cases."},
 {id:"JLPT",name:"JLPT",kind:"Japanese proficiency",
 info:"Relevant to some Japanese-language programmes."},
 {id:"EJU",name:"EJU",kind:"Japanese university admission",
 info:"Used for certain undergraduate admissions in Japan."},
 {id:"TOPIK",name:"TOPIK",kind:"Korean proficiency",
 info:"Relevant to some Korean-language programmes."},
 {id:"HSK",name:"HSK",kind:"Chinese proficiency",
 info:"Relevant to some Chinese-language programmes."},
 {id:"Other",name:"Other requirement",kind:"Programme-specific",
 info:"Record interviews, portfolios, institutional tests or other requirements."}
];

const RANKINGS=[
 {name:"QS World University Rankings",
 url:"https://www.topuniversities.com/world-university-rankings",
 description:"Explore global and subject-specific rankings."},
 {name:"Times Higher Education World University Rankings",
 url:"https://www.timeshighereducation.com/world-university-rankings/latest/world-ranking",
 description:"Explore global university rankings and their methodology."}
];

function readSaved(){
 try{
  const data=JSON.parse(localStorage.getItem(KEY));
  return data&&typeof data==="object"?data:{};
 }catch(e){return {};}
}
let records=readSaved();

function save(){
 try{localStorage.setItem(KEY,JSON.stringify(records));}
 catch(e){alert("Unable to save. Check browser storage settings.");}
}

function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

function addNavTab(id,label){
 const nav=document.getElementById("navigation");
 if(!nav||document.getElementById("nav-"+id))return;
 const btn=document.createElement("button");
 btn.id="nav-"+id;
 btn.dataset.tab=id;
 btn.textContent=label;
 btn.addEventListener("click",()=>window.showTab(id));
 nav.appendChild(btn);
}

function addSection(id,html){
 if(document.getElementById(id))return;
 const section=document.createElement("section");
 section.id=id;
 section.className="section";
 section.innerHTML=html;
 document.querySelector("main").appendChild(section);
}

addNavTab("rankings","🏆 Rankings");
addNavTab("tests","📝 Tests");

addSection("rankings",`
<div class="panel">
 <h2>Explore University Rankings</h2>
 <p class="muted">
 Rankings are useful research tools, but they should not
 be your only reason for choosing a university.
 </p>
 <div id="am21-ranking-list"></div>
 <div class="am21-note">
 Ranking positions and methodologies change.
 AdmitMate links to the official ranking providers
 rather than displaying unlicensed or unverified data.
 </div>
</div>
<div class="panel">
 <h2>How to compare universities</h2>
 <p>Consider these factors alongside rankings:</p>
 <ul>
  <li>Ranking for your intended subject</li>
  <li>Programme curriculum and teaching language</li>
  <li>Tuition and estimated living costs</li>
  <li>Scholarship opportunities</li>
  <li>Admission and language requirements</li>
  <li>Career opportunities and applicable visa rules</li>
 </ul>
 <button class="primary" id="am21-open-universities">
  Open my university shortlist
 </button>
</div>`);

document.getElementById("am21-ranking-list").innerHTML=
RANKINGS.map(r=>`
<div class="am21-rank">
 <h3>${escapeHTML(r.name)}</h3>
 <p class="muted">${escapeHTML(r.description)}</p>
 <a href="${r.url}" target="_blank" rel="noopener noreferrer">
  View official rankings ↗
 </a>
</div>`).join("");

document.getElementById("am21-open-universities")
 .onclick=()=>window.showTab("universities");

addSection("tests",`
<div class="panel">
 <h2>Tests & Admission Requirements</h2>
 <p class="muted">
 Organize the tests you may need for your chosen programme.
 </p>
 <div class="am21-note">
 Requirements depend on the university, programme,
 study level, teaching language and applicant background.
 A test appearing here does not mean it is mandatory.
 Always verify with the institution.
 </div>

 <div class="grid">
  <div>
   <label>Destination country</label>
   <select id="am21-country"></select>
  </div>
  <div>
   <label>University or programme</label>
   <input id="am21-program"
    placeholder="e.g. Kyoto University, MSc">
  </div>
 </div>
 <button class="primary" id="am21-load">
  View test planner
 </button>
</div>
<div class="panel">
 <h2>My Test Planner</h2>
 <p id="am21-context" class="muted"></p>
 <div id="am21-test-list"></div>
</div>`);

const countrySelect=document.getElementById("am21-country");
if(typeof COUNTRIES!=="undefined"){
 countrySelect.innerHTML=COUNTRIES.map(c=>
 `<option value="${escapeHTML(c.name)}">${c.flag} ${escapeHTML(c.name)}</option>`
 ).join("");
}

let currentCountry="Japan";
let currentProgram="General research";

function recordKey(id){
 return JSON.stringify([currentCountry,currentProgram,id]);
}

function renderTests(){
 document.getElementById("am21-context").textContent=
 currentCountry+" · "+currentProgram;

 const list=document.getElementById("am21-test-list");
 list.innerHTML=TESTS.map(t=>{
  const key=recordKey(t.id);
  const data=records[key]||{};
  return `
  <div class="am21-test">
   <h3>${escapeHTML(t.name)}</h3>
   <p class="muted">${escapeHTML(t.kind)}.
    ${escapeHTML(t.info)}</p>
   <div class="am21-fields">
    <div>
     <label>Requirement status</label>
     <select data-key="${escapeHTML(key)}" data-field="status">
      ${["Needs verification","Required","Optional",
         "Waived","Not required"].map(s=>
       `<option value="${s}" ${data.status===s?"selected":""}>${s}</option>`
      ).join("")}
     </select>
    </div>
    <div>
     <label>Test date</label>
     <input type="date" data-key="${escapeHTML(key)}"
      data-field="date" value="${escapeHTML(data.date||"")}">
    </div>
    <div>
     <label>Score (if available)</label>
     <input data-key="${escapeHTML(key)}" data-field="score"
      value="${escapeHTML(data.score||"")}"
      placeholder="Your score">
    </div>
    <div>
     <label>Progress</label>
     <select data-key="${escapeHTML(key)}" data-field="progress">
      ${["Not started","Preparing","Booked",
         "Completed"].map(s=>
       `<option value="${s}" ${data.progress===s?"selected":""}>${s}</option>`
      ).join("")}
     </select>
    </div>
   </div>
   <label>Official requirement source or notes</label>
   <input data-key="${escapeHTML(key)}" data-field="notes"
    value="${escapeHTML(data.notes||"")}"
    placeholder="Paste official URL or add notes">
  </div>`;
 }).join("");

 list.querySelectorAll("[data-key]").forEach(input=>{
  input.addEventListener("change",()=>{
   const key=input.dataset.key;
   const field=input.dataset.field;
   if(!records[key])records[key]={};
   records[key][field]=input.value;
   save();
  });
 });
}

document.getElementById("am21-load").onclick=()=>{
 currentCountry=countrySelect.value;
 currentProgram=document.getElementById("am21-program")
  .value.trim()||"General research";
 renderTests();
};

renderTests();

/* FLOATING NAVIGATION ASSISTANT */
const fab=document.createElement("button");
fab.className="am21-fab";
fab.textContent="💬";
fab.setAttribute("aria-label","Open AdmitMate Assistant");
document.body.appendChild(fab);

const chat=document.createElement("div");
chat.className="am21-chat";
chat.setAttribute("role","dialog");
chat.setAttribute("aria-label","AdmitMate Assistant");
chat.innerHTML=`
 <div class="am21-chathead">
  <strong>🎓 AdmitMate Assistant</strong>
  <button id="am21-close" aria-label="Close chat">×</button>
 </div>
 <div class="am21-messages" id="am21-messages"></div>
 <div class="am21-chips">
  <button data-question="How do I get started?">Get started</button>
  <button data-question="Where can I see rankings?">Rankings</button>
  <button data-question="How do I track tests?">Tests</button>
  <button data-question="How do I save universities?">Universities</button>
 </div>
 <form class="am21-chatform" id="am21-form">
  <input id="am21-input" aria-label="Your question"
   placeholder="Ask me how to use AdmitMate..." required>
  <button type="submit">Send</button>
 </form>`;
document.body.appendChild(chat);

const messages=document.getElementById("am21-messages");

function addMessage(message,from){
 const div=document.createElement("div");
 div.className="am21-msg "+(from==="user"?"am21-user":"am21-bot");
 div.textContent=message;
 messages.appendChild(div);
 messages.scrollTop=messages.scrollHeight;
}

function answer(question){
 const q=question.toLowerCase();
 if(/hello|^hi$|hey/.test(q))
  return "Hello! 👋 I can help you navigate AdmitMate. Try asking about profiles, countries, rankings, tests, scholarships or applications.";
 if(/start|begin|new here/.test(q))
  return "Start in Profile. Add your qualification, subject, budget and goals. Then visit Countries to choose destinations. Your selections appear under My Plan.";
 if(/rank|qs|times higher|the ranking/.test(q))
  return "Open Rankings in the navigation bar to explore official QS and THE rankings. Compare subject rankings, costs, language requirements and scholarships too.";
 if(/test|ielts|toefl|gre|gmat|jlpt|topik|hsk|exam/.test(q))
  return "Open Tests. Select a country and enter your programme. Mark each test as Required, Optional, Waived, Not required or Needs verification. Check your university's official admissions page first.";
 if(/universit|shortlist|college|programme|program/.test(q))
  return "Open Universities to add a university, destination, programme and official link. Your saved shortlist will appear under My Plan.";
 if(/scholarship|funding|financial aid/.test(q))
  return "Open Scholarships to save opportunities and deadlines. Always verify eligibility, funding amounts and deadlines on official sources.";
 if(/sop|statement of purpose|essay/.test(q))
  return "Open SOP Builder. Answer the questions using your real experiences, generate a structured draft, and edit it to meet your programme's instructions.";
 if(/application|deadline|submit/.test(q))
  return "Open Applications to track programmes, deadlines and application status. Use Tests to manage examination requirements separately.";
 if(/country|japan|korea|germany|destination|compare/.test(q))
  return "Open Countries and select destinations to compare. The current beta provides official research links rather than verified cost or visa comparisons.";
 if(/visa|immigration|pr|work permit/.test(q))
  return "Visa and post-study work rules vary and can change. Use official immigration authority websites for current requirements. AdmitMate does not predict visa or PR outcomes.";
 if(/language|translation|tamil|hindi/.test(q))
  return "Choose your preferred language under Profile. The beta currently displays English text; full interface translations are not implemented yet.";
 if(/save|refresh|data|export/.test(q))
  return "Your planning data is saved in this browser. Use Export my plan under My Plan to keep a text copy. Clearing browser storage may erase saved progress.";
 return "I can help with AdmitMate navigation, including Profile, Countries, Rankings, Universities, Scholarships, Tests, SOP Builder and Applications. Try asking where to find a feature. For detailed admissions advice, check the institution's official website.";
}

function ask(q){
 addMessage(q,"user");
 addMessage(answer(q),"bot");
}

fab.onclick=()=>{
 chat.classList.toggle("open");
 if(chat.classList.contains("open"))
  document.getElementById("am21-input").focus();
};
document.getElementById("am21-close").onclick=
 ()=>chat.classList.remove("open");

document.getElementById("am21-form").onsubmit=e=>{
 e.preventDefault();
 const input=document.getElementById("am21-input");
 const q=input.value.trim();
 if(!q)return;
 ask(q);input.value="";
};

chat.querySelectorAll("[data-question]").forEach(b=>{
 b.onclick=()=>ask(b.dataset.question);
});

addMessage(
"Hi! 👋 I'm your AdmitMate navigation assistant.\n\nI can help you find features, understand the planning workflow and organize your next steps. What would you like to do?",
"bot"
);

/* Ensure new tabs work with the existing v2.0 navigation */
const originalShowTab=window.showTab;
if(typeof originalShowTab==="function"){
 window.showTab=function(name){
  originalShowTab(name);
  document.querySelectorAll("#navigation button").forEach(b=>{
   b.classList.toggle("active",b.dataset.tab===name);
  });
 };
}

})();
</script>
<!-- ADMITMATE v2.1 ADD-ON: END -->
